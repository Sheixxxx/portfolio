*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--fb);overflow-x:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.demo{position:relative;z-index:3;background:var(--acc);color:#111;text-align:center;font-size:13px;font-weight:600;padding:8px 16px}
header,main,footer{position:relative;z-index:2}
.w{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .w{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:22px}
.logo{font:700 16px var(--fd)}.logo i{color:var(--acc);font-style:normal}
nav{display:flex;gap:22px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;font-size:14px}nav a:hover{color:var(--fg)}
.hero .w{padding-block:clamp(48px,9vw,120px);display:grid;gap:26px}
.chip{display:inline-flex;gap:8px;width:max-content;max-width:100%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--muted)}.chip b{color:var(--acc)}
h1{font:700 clamp(36px,7vw,92px)/1.02 var(--fd);letter-spacing:-.03em;margin:0;max-width:13ch;text-wrap:balance}
h1 span{display:block;font-weight:400;font-size:.4em;letter-spacing:0;margin-top:14px;color:var(--acc2)}
.lead{max-width:48ch;color:var(--muted);font-size:clamp(16px,1.7vw,19px);margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 22px;border-radius:99px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);color:var(--fg);text-decoration:none;font-weight:600;transition:transform .2s,border-color .2s;cursor:pointer;font:600 15px var(--fb)}
.btn:hover{transform:translateY(-2px);border-color:var(--acc)}.btn.p{background:var(--acc);color:#111;border-color:var(--acc)}
section.s .w{padding-block:clamp(64px,9vw,120px)}
.eb{color:var(--acc);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px;font-weight:600}
h2{font:700 clamp(26px,4vw,48px)/1.1 var(--fd);letter-spacing:-.02em;margin:0 0 40px;max-width:18ch;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{perspective:900px;min-width:0}
.ci{border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(12px);padding:26px;height:100%;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s;transform-style:preserve-3d}
.card:hover .ci{border-color:var(--acc)}
.ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));transform:translateZ(30px);margin-bottom:18px}
.ci h3{font:700 18px var(--fd);margin:0 0 8px}.ci p{margin:0;color:var(--muted);font-size:15px}.pr{display:block;margin-top:14px;color:var(--acc2);font-weight:600}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.why div{background:var(--bg2);padding:26px 22px;min-width:0}.why b{display:block;font:700 clamp(24px,3vw,36px) var(--fd)}.why span{color:var(--muted);font-size:14px}
.ct{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.box{border:1px solid var(--line);border-radius:24px;background:var(--glass);backdrop-filter:blur(14px);padding:clamp(24px,4vw,44px);min-width:0}
.row{display:grid;gap:4px;padding-block:14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.row div{font-size:18px;word-break:break-word}
.phone{font:700 clamp(22px,3vw,32px) var(--fd);user-select:all}
form{display:grid;gap:12px}label{font-size:13px;color:var(--muted)}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit}
input:focus,a:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ok{color:var(--acc2);font-weight:600}
footer .w{padding-block:36px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.list a{display:grid;gap:4px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);text-decoration:none;min-width:0;transition:border-color .2s,transform .2s}
.list a:hover{border-color:var(--acc);transform:translateY(-2px)}.list b{font:700 16px var(--fd)}.list span{color:var(--muted);font-size:13px}
@media(max-width:900px){.grid,.list{grid-template-columns:minmax(0,1fr)}.why{grid-template-columns:repeat(2,minmax(0,1fr))}.ct{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){nav a:nth-child(n+2){display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
